<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Actualité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16161a; --ink2:#3d3d45; --muted:#6b6b75; --rule:#d9d6cf; --paper:#fbfaf7; --card:#fff;
  --accent:#b3121f; --accent2:#0d3b66;
  --serif:"Source Serif 4",Georgia,serif; --display:"Playfair Display",Georgia,serif; --sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* masthead */
.topbar{font-family:var(--sans);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);gap:12px;flex-wrap:wrap}
.topbar .search{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;background:#fff}
.topbar input{border:0;outline:0;font:inherit;font-size:13px;width:200px;background:transparent}
.mast{text-align:center;padding:22px 0 10px}
.mast h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6vw,68px);margin:0;letter-spacing:-.5px;cursor:pointer}
.mast .sub{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
nav.rub{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:6px 0;font-family:var(--sans);font-size:13px;font-weight:600;position:sticky;top:0;background:var(--paper);z-index:20}
nav.rub button{background:none;border:0;padding:6px 10px;border-radius:4px;color:var(--ink)}
nav.rub button:hover{background:#efece5}
nav.rub button.on{color:var(--accent)}
/* ticker */
.ticker{display:flex;gap:0;overflow-x:auto;font-family:var(--sans);font-size:12.5px;border-bottom:1px solid var(--rule);scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{padding:9px 14px;white-space:nowrap;border-right:1px solid var(--rule)}
.tk b{font-weight:600;margin-right:6px}
.up{color:#0a7a3e}.down{color:#c0182a}.flat{color:var(--muted)}
.tknote{font-family:var(--sans);font-size:11.5px;color:var(--muted);padding:6px 0 0}
/* une */
.edhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;font-family:var(--sans);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.lead{display:grid;grid-template-columns:1.55fr 1fr;gap:28px;padding-bottom:26px;border-bottom:1px solid var(--rule)}
.lead .main h2{font-family:var(--display);font-size:clamp(28px,3.4vw,42px);line-height:1.1;margin:14px 0 10px}
.lead .main p{font-size:19px;color:var(--ink2);margin:0}
.side .s{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--rule);cursor:pointer}
.side .s:last-child{border-bottom:0}
.side h3{font-family:var(--display);font-size:22px;line-height:1.2;margin:8px 0 6px}
.side p{margin:0;color:var(--ink2);font-size:15.5px}
.kicker{font-family:var(--sans);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.click{cursor:pointer}
.click:hover h2,.click:hover h3,.click:hover h4{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
/* cover visuals */
.cover{position:relative;overflow:hidden;border-radius:4px;aspect-ratio:16/9;background:var(--c1);color:#fff;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 15%,var(--c2) 0%,transparent 60%),linear-gradient(135deg,var(--c1),var(--c3));z-index:-2}
.cover .pat{position:absolute;inset:0;opacity:.13;z-index:-1;background-image:repeating-linear-gradient(115deg,#fff 0 1px,transparent 1px 18px)}
.cover .flags{position:absolute;right:-4%;top:12%;display:flex;flex-direction:column;gap:12px;transform:rotate(-8deg)}
.cover .flags img{width:clamp(110px,22vw,250px);box-shadow:0 18px 40px rgba(0,0,0,.35);border-radius:3px}
.cover .flags img+img{margin-left:-30%;width:clamp(80px,15vw,170px)}
.cover .num{position:absolute;left:5%;bottom:9%;max-width:62%}
.cover .num b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(34px,6.2vw,76px);line-height:1;text-shadow:0 4px 20px rgba(0,0,0,.25)}
.cover .num span{display:block;font-family:var(--sans);font-size:clamp(11px,1.3vw,14px);opacity:.92;margin-top:6px;letter-spacing:.02em}
.cover .tag{position:absolute;left:5%;top:8%;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.16);backdrop-filter:blur(4px);padding:5px 9px;border-radius:3px}
.cover.sm{aspect-ratio:16/10}
.cover.sm .num b{font-size:clamp(24px,3vw,34px)}
.cover.sm .flags img{width:clamp(70px,9vw,110px)}
.cover.sm .flags img+img{width:clamp(50px,6vw,80px)}
.cover.sm .tag{display:none}
.photo{margin:0;position:relative;border-radius:4px;overflow:hidden;background:#e9e6df}
.photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.photo.sm img{aspect-ratio:16/10}
.photo figcaption{font-family:var(--sans);font-size:11.5px;color:var(--muted);padding:6px 2px 0;background:var(--paper)}
.photo .fallback{display:none}
.photo.broken img,.photo.broken figcaption{display:none}
.photo.broken .fallback{display:block}
.art .photo{margin:0 0 28px}
/* sections */
.region{padding:26px 0 8px;border-bottom:1px solid var(--rule)}
.region>h2{font-family:var(--display);font-size:30px;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.region>h2::after{content:"";flex:1;height:1px;background:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 28px;margin-top:14px}
.sect{grid-column:span 1}
.sect.wide{grid-column:span 3}
.sect h5{font-family:var(--sans);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.it{padding:0 0 13px;margin:0 0 13px;border-bottom:1px solid #ebe8e1;cursor:pointer;display:block}
.it:last-child{border-bottom:0}
.it h4{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.22;margin:0 0 5px}
.it.big h4{font-size:24px}
.it p{margin:0;font-size:15px;color:var(--ink2);line-height:1.45}
.it .flg{float:right;width:34px;margin:4px 0 4px 10px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.wide .row{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.ag{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent2);padding:12px 14px;font-size:15px}
.ag b{display:block;font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent2);margin-bottom:4px}
/* article */
.art{max-width:760px;margin:0 auto;padding:26px 0 60px}
.art .back{font-family:var(--sans);font-size:13px;color:var(--muted);background:none;border:0;padding:0;margin-bottom:18px}
.art .back:hover{color:var(--ink)}
.art h1{font-family:var(--display);font-size:clamp(32px,4.4vw,48px);line-height:1.08;margin:10px 0 14px}
.art .chapo{font-size:21px;line-height:1.45;color:var(--ink2);margin:0 0 18px}
.art .meta{font-family:var(--sans);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.art .cover{margin:0 0 28px}
.art h2{font-family:var(--display);font-size:26px;margin:34px 0 10px}
.art p{margin:0 0 16px;font-size:18.5px;line-height:1.65}
.box{background:#fff;border:1px solid var(--rule);border-top:4px solid var(--ink);padding:16px 20px;margin:0 0 26px}
.box h3{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 10px}
.box ul{margin:0;padding-left:18px}
.box li{margin:0 0 7px;font-size:16.5px}
.deal{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 22px}
.party{background:#fff;border:1px solid var(--rule);padding:16px 18px;border-radius:4px}
.party .role{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.party h4{font-family:var(--display);font-size:22px;margin:4px 0 8px}
.party p{font-size:15.5px;line-height:1.5;margin:0 0 8px}
.party .orig{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
table.terms{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:14px;margin:0 0 26px;background:#fff}
table.terms td{border-bottom:1px solid var(--rule);padding:9px 12px;vertical-align:top}
table.terms td:first-child{color:var(--muted);width:38%}
.chrono{border-left:2px solid var(--ink);margin:8px 0 26px 6px;padding-left:20px}
.chrono .ev{position:relative;margin-bottom:16px}
.chrono .ev::before{content:"";position:absolute;left:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.chrono .ev b{font-family:var(--sans);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;display:block;color:var(--accent2)}
.chrono .ev span{font-size:16.5px}
.sources{font-family:var(--sans);font-size:13.5px;border-top:2px solid var(--ink);margin-top:36px;padding-top:12px}
.sources h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 8px}
.sources a{color:var(--accent2);text-decoration:underline;text-underline-offset:2px}
.sources li{margin-bottom:5px}
.note{font-family:var(--sans);font-size:13px;background:#fff7e6;border:1px solid #f0d9a8;padding:10px 14px;border-radius:4px;margin:0 0 22px}
.related{margin-top:34px}
.related h3{font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.14em;margin:0 0 10px}
.related .it h4{font-size:17px}
/* archives */
.arch h2{font-family:var(--display);font-size:34px;margin:26px 0 6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px;font-family:var(--sans);font-size:13px}
.filters button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:5px 12px}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.month{margin:22px 0 8px;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.edlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.edcard{background:#fff;border:1px solid var(--rule);padding:14px 16px;cursor:pointer;border-radius:4px}
.edcard:hover{border-color:var(--ink)}
.edcard .d{font-family:var(--sans);font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.edcard h4{font-family:var(--display);font-size:18px;line-height:1.25;margin:6px 0 0}
.results .it{background:#fff;border:1px solid var(--rule);padding:12px 14px;border-radius:4px;margin-bottom:10px}
.results .it .d{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--sans)}
footer{font-family:var(--sans);font-size:12px;color:var(--muted);text-align:center;padding:30px 0 40px;border-top:1px solid var(--rule);margin-top:30px}
@media (max-width:860px){
  .lead{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .sect.wide{grid-column:span 1}
  .wide .row{grid-template-columns:1fr}
  .deal{grid-template-columns:1fr}
  .topbar input{width:130px}
}
</style>
</head>

  "Asie & Moyen-Orient":["#4a2470","#9b6bcf","#220f36"],
  "Deals & buy-side":["#14213d","#fca311","#0a1020"]
};
const NAVS=[["une","À la une"],...RUBS.map(r=>[r,r==="Asie & Moyen-Orient"?"Asie":r==="Amérique du Nord"?"Am. du Nord":r==="Amérique du Sud"?"Am. du Sud":r==="Deals & buy-side"?"Deals":r]),["archives","Archives"]];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
let EDITIONS=[], CONTENT={};

$("#today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("#home").onclick=()=>go("une");
$("#nav").innerHTML=NAVS.map(([k,l])=>`<button data-k="${esc(k)}">${esc(l)}</button>`).join("");
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;
  if(k==="une"||k==="archives")go(k);
  else{ if(!location.hash.startsWith("#e-")&&location.hash!=="#une"&&location.hash!==""){go("une");setTimeout(()=>scrollToRub(k),300)} else scrollToRub(k)}};
function scrollToRub(r){const el=document.getElementById("r-"+slug(r));if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-60,behavior:"smooth"})}
function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
function flag(c){return FLAGS[(c||"").toLowerCase()]}
function fmtDate(d){const [y,m,j]=d.split("-").map(Number);return `${j} ${MOIS[m-1]} ${y}`}
function wday(d){return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}

function cover(item,small,noimg){
  const p=PAL[item.r]||PAL["Europe"];
  const fl=(item.p||[]).filter(flag).slice(0,2).map(c=>`<img alt="" src="${flag(c)}">`).join("");
  const v=item.v||{};
  if(!noimg&&item.img&&item.img.u){
    const src=item.img.u.startsWith("http")?item.img.u:"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(item.img.u)+"?width="+(small?640:1400);
    return `<figure class="photo${small?" sm":""}"><img alt="${esc(item.img.alt||"")}" src="${esc(src)}" loading="lazy" onerror="this.closest('figure').classList.add('broken')">${!small&&item.img.credit?`<figcaption>${esc(item.img.credit)}</figcaption>`:""}<div class="fallback">${cover(item,small,true)}</div></figure>`;
  }
  return `<div class="cover${small?" sm":""}" style="--c1:${p[0]};--c2:${p[1]};--c3:${p[2]}"><div class="pat"></div>
    <div class="tag">${esc(item.r)}${item.s?" · "+esc(item.s):""}</div>
    <div class="flags">${fl}</div>
    ${v.n?`<div class="num"><b>${esc(v.n)}</b>${v.l?`<span>${esc(v.l)}</span>`:""}</div>`:""}</div>`;
}
function itemHTML(it,big){
  const f=(it.p||[]).map(flag).find(Boolean);
  return `<a class="it${big?" big":""}" href="#a-${esc(it.id)}">${f&&!big?`<img class="flg" alt="" src="${f}">`:""}<h4>${esc(it.t)}</h4>${it.c?`<p>${esc(it.c)}</p>`:""}</a>`;
}

async function init(){
  try{
    const r=await fetch("data/index.json?v="+Date.now()); EDITIONS=(await r.json()).editions||[];
    EDITIONS.sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ app.innerHTML=`<div class="empty">Impossible de charger les éditions.</div>`; return }
  route();
}
async function content(date){
  if(CONTENT[date])return CONTENT[date];
  try{const r=await fetch("data/editions/"+date+".json"); CONTENT[date]=(await r.json()).articles||{}}catch(e){CONTENT[date]={}}
  return CONTENT[date];
}
function setNav(k){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k))}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  window.scrollTo(0,0);
  if(!EDITIONS.length){app.innerHTML=`<div class="empty">Aucune édition pour l'instant.</div>`;return}
  if(h.startsWith("a-"))return showArticle(h.slice(2));
  if(h.startsWith("e-"))return showEdition(h.slice(2));
  if(h==="archives")return showArchives("");
  return showEdition(EDITIONS[0].date);
}

function showEdition(date){
  setNav("une");
  const ed=EDITIONS.find(e=>e.date===date)||EDITIONS[0];
  const items=ed.items||[]; const by=id=>items.find(i=>i.id===id);
  const lead=by(ed.une)||items[0];
  const tl=(ed.tldr||[]).map(by).filter(x=>x&&x!==lead);
  const tick=(ed.chiffres||[]).map(c=>`<div class="tk"><b>${esc(c.a)}</b>${esc(c.n)} <span class="${c.s||"flat"}">${esc(c.v)}</span></div>`).join("");
  let html=`${tick?`<div class="ticker">${tick}</div>`:""}${ed.chiffres_note?`<div class="tknote">${esc(ed.chiffres_note)}</div>`:""}
  <div class="edhead"><span>Édition du ${esc(wday(ed.date))}</span><span>${items.length} articles</span></div>
  <section class="lead">
    <a class="main click" href="#a-${esc(lead.id)}">${cover(lead)}<div class="kicker" style="margin-top:14px">${esc(lead.r)} · ${esc(lead.s||"")}</div><h2>${esc(lead.t)}</h2><p>${esc(lead.c)}</p></a>
    <div class="side">${tl.map(t=>`<a class="s click" href="#a-${esc(t.id)}" style="display:block">${cover(t,true)}<div class="kicker" style="margin-top:10px">${esc(t.r)}</div><h3>${esc(t.t)}</h3><p>${esc(t.c)}</p></a>`).join("")}</div>
  </section>`;
  for(const r of RUBS){
    const ri=items.filter(i=>i.r===r);
    if(!ri.length)continue;
    const secs=[...new Set(ri.map(i=>i.s||""))].sort((a,b)=>(SECTS.indexOf(a)+99)%99-(SECTS.indexOf(b)+99)%99);
    html+=`<section class="region" id="r-${slug(r)}"><h2>${esc(r)}</h2><div class="cols">`;
    for(const s of secs){
      const si=ri.filter(i=>(i.s||"")===s).sort((a,b)=>(b.imp||1)-(a.imp||1));
      const wide=s==="À la une"&&si[0];
      if(wide){
        const [f,...rest]=si;
        html+=`<div class="sect wide"><h5>${esc(s)}</h5><div class="row"><a class="click" href="#a-${esc(f.id)}">${cover(f,true)}</a><div>${itemHTML(f,true)}${rest.map(x=>itemHTML(x)).join("")}</div></div></div>`;
      } else html+=`<div class="sect"><h5>${esc(s||"Actualité")}</h5>${si.map(x=>itemHTML(x,(x.imp||1)>=3)).join("")}</div>`;
    }
    html+=`</div></section>`;
  }
  if((ed.agenda||[]).length)html+=`<section class="region" id="r-agenda"><h2>Agenda</h2><div class="agenda">${ed.agenda.map(a=>`<div class="ag"><b>${esc(a.j)}</b>${esc(a.t)}</div>`).join("")}</div></section>`;
  const i=EDITIONS.indexOf(ed);
  html+=`<div class="edhead" style="margin-top:26px">${EDITIONS[i+1]?`<a href="#e-${EDITIONS[i+1].date}">← Édition du ${esc(fmtDate(EDITIONS[i+1].date))}</a>`:"<span></span>"}${i>0?`<a href="#e-${EDITIONS[i-1].date}">Édition du ${esc(fmtDate(EDITIONS[i-1].date))} →</a>`:""}</div>`;
  app.innerHTML=html;
}

function paras(t){return String(t||"").split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join("")}

async function showArticle(id){
  setNav("");
  const date=id.slice(0,10);
  const ed=EDITIONS.find(e=>e.date===date);
  const it=ed&&(ed.items||[]).find(i=>i.id===id);
  if(!it){app.innerHTML=`<div class="empty">Article introuvable.</div>`;return}
  app.innerHTML=`<article class="art"><div class="empty">Chargement de l'article…</div></article>`;
  const c=(await content(date))[id]||{};
  const words=JSON.stringify(c).split(/\s+/).length; const min=Math.max(1,Math.round(words/230));
  let h=`<article class="art"><button class="back" onclick="go('e-${date}')">← Édition du ${esc(fmtDate(date))}</button>
  <div class="kicker">${esc(it.r)}${it.s?" · "+esc(it.s):""}</div><h1>${esc(it.t)}</h1>${it.c?`<p class="chapo">${esc(it.c)}</p>`:""}
  <div class="meta"><span>${esc(wday(date))}</span><span>Lecture ${min} min</span>${(c.sources||[]).length?`<span>${c.sources.length} source${c.sources.length>1?"s":""}</span>`:""}</div>
  ${cover(it)}`;
  if(c.note)h+=`<div class="note">${esc(c.note)}</div>`;
  if((c.cles||[]).length)h+=`<div class="box"><h3>L'essentiel</h3><ul>${c.cles.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  const d=c.deal;
  if(d){
    const party=(role,x)=>x?`<div class="party"><div class="role">${esc(role)}</div><h4>${esc(x.nom)}</h4><p>${esc(x.activite)}</p>${x.origine?`<p class="orig">${esc(x.origine)}</p>`:""}${x.chiffres?`<p class="orig"><b>${esc(x.chiffres)}</b></p>`:""}</div>`:"";
    h+=`<h2>Les parties</h2><div class="deal">${party(d.role_cible||"Cible",d.cible)}${party(d.role_acquereur||"Acquéreur",d.acquereur)}</div>`;
    if((d.termes||[]).length)h+=`<h2>Les termes</h2><table class="terms">${d.termes.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
    if(d.strategie)h+=`<h2>La logique stratégique</h2>${paras(d.strategie)}`;
    if((d.acteurs||[]).length)h+=`<h2>Les acteurs</h2><div class="box" style="border-top-color:var(--accent2)"><ul>${d.acteurs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
    if(d.etapes)h+=`<h2>Et maintenant ?</h2>${paras(d.etapes)}`;
  }
  for(const s of (c.corps||[])) h+=`${s.h?`<h2>${esc(s.h)}</h2>`:""}${paras(s.p)}`;
  if((c.chrono||[]).length)h+=`<h2>Chronologie</h2><div class="chrono">${c.chrono.map(e=>`<div class="ev"><b>${esc(e.d)}</b><span>${esc(e.t)}</span></div>`).join("")}</div>`;
  if(!c.corps&&!c.deal)h+=`<p>${esc(it.c||"")}</p>`;
  if((c.sources||[]).length)h+=`<div class="sources"><h3>Sources</h3><ul>${c.sources.map(s=>`<li><a href="${esc(/^https?:\/\//.test(s.u)?s.u:"#")}" target="_blank" rel="noopener">${esc(s.n)}</a></li>`).join("")}</ul></div>`;
  const rel=related(it);
  if(rel.length)h+=`<div class="related"><h3>Sur le même sujet</h3>${rel.map(r=>itemHTML({...r,c:fmtDate(r.id.slice(0,10))+" — "+(r.c||"")})).join("")}</div>`;
  h+=`</article>`;
  app.innerHTML=h;
}
function related(it){
  const tags=new Set([...(it.k||[])].map(x=>x.toLowerCase()));
  if(!tags.size)return[];
  const out=[];
  for(const e of EDITIONS)for(const x of (e.items||[])){
    if(x.id===it.id)continue;
    const n=(x.k||[]).filter(t=>tags.has(t.toLowerCase())).length;
    if(n)out.push([n,x]);
  }
  return out.sort((a,b)=>b[0]-a[0]||b[1].id.localeCompare(a[1].id)).slice(0,5).map(x=>x[1]);
}

let archFilter="Tout";
function showArchives(q){
  setNav("archives");
  const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  let h=`<section class="arch"><h2>Archives</h2><div class="filters">${["Tout",...RUBS].map(r=>`<button class="${r===archFilter?"on":""}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>`;
  if(q||archFilter!=="Tout"){
    const nq=norm(q); const res=[];
    for(const e of EDITIONS)for(const x of (e.items||[])){
      if(archFilter!=="Tout"&&x.r!==archFilter)continue;
      if(nq&&!norm(x.t+" "+x.c+" "+(x.k||[]).join(" ")).includes(nq))continue;
      res.push(x);
    }
    h+=`<div class="month">${res.length} résultat${res.length>1?"s":""}${q?` pour « ${esc(q)} »`:""}</div><div class="results">${res.slice(0,300).map(x=>`<a class="it" href="#a-${esc(x.id)}"><div class="d">${esc(fmtDate(x.id.slice(0,10)))} · ${esc(x.r)}</div><h4>${esc(x.t)}</h4><p>${esc(x.c)}</p></a>`).join("")}</div>`;
  } else {
    let cur="";
    for(const e of EDITIONS){
      const m=e.date.slice(0,7);
      if(m!==cur){if(cur)h+=`</div>`;cur=m;const [y,mm]=m.split("-");h+=`<div class="month">${MOIS[+mm-1]} ${y}</div><div class="edlist">`}
      const lead=(e.items||[]).find(i=>i.id===e.une)||(e.items||[])[0]||{};
      h+=`<a class="edcard" href="#e-${e.date}"><div class="d">${esc(wday(e.date))}</div><h4>${esc(lead.t||"")}</h4></a>`;
    }
    if(cur)h+=`</div>`;
  }
  h+=`</section>`;
  app.innerHTML=h;
  app.querySelector(".filters").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;archFilter=b.dataset.r;showArchives($("#q").value.trim())};
}
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{const v=e.target.value.trim(); if(location.hash!=="#archives")history.replaceState(null,"","#archives"); showArchives(v)},250)});
window.addEventListener("hashchange",route);
init();
</script>
</body>
</html>
